<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <div class="chatroom-container">
    <div class="header">
      <span class="title">Techup Chatroom</span>
    </div>

    <div class="chat-box">
      <div class="message-box right green">
        <span class="message1">สวัสดีจ้า</span>
      </div>

      <div class="message-box right gray">
        <span class="message coding">Coding สนุกจังเลย</span>
        <button class="close-btn">x</button>
      </div>

      <div class="message-box right green">
        <span class="message1">🥳🤩</span>
      </div>

      <div class="message-box left">
        <span class="message">🤩</span>
      </div>

      <div class="message-box left">
        <span class="message">🥳</span>
      </div>
    </div>
  </div>

</body>
</html>
</body>

</html>
