<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- Start coding here -->
  <!-- Header -->
  <header>
    <h1>Techup</h1>
  </header>

  <!-- Chat Body -->
  <div class="chat-body">

    <!-- Right Chat -->
    <div class="right-chat">
      <div class="chat-box" style="background-color: #09be09;">
        <p>สวัสดีจ้า</p>
      </div>
      <div class="chat-box" style="background-color: #E7E3E3;">
        <p>Coding สนุกจังเลย</p>
        <div class="close-btn">x</div>
      </div>
      <div class="chat-box" style="background-color: #09be09;">
        <p>🥳🤩</p>
      </div>
    </div>

    <!-- Left Chat -->
    <div class="left-chat">
      <div class="chat-box" style="background-color: #808080;">
        <p>🤩</p>
      </div>
      <div class="chat-box" style="background-color: #808080;">
        <p>🥳</p>
      </div>
    </div>

  </div>
</body>

</html>
